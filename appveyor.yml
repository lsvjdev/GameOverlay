# AppVeyor builds this project on its own Windows worker, not GitHub Actions.
# Free AppVeyor plan requires a PUBLIC open-source repository.
version: 0.1.{build}
image: Visual Studio 2022
configuration: Release
platform: x64

build_script:
  - cmd: dotnet --version
  - cmd: dotnet publish src\LSVJOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

after_build:
  - ps: Compress-Archive -Path .\publish\* -DestinationPath .\LSVJOverlay-win-x64.zip -Force

test: off

artifacts:
  - path: LSVJOverlay-win-x64.zip
    name: LSVJOverlay-win-x64
